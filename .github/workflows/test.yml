name: Installer tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum-go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.6
          cache: false
      - name: Minimum Go compatibility
        run: |
          go test ./...
          go vet ./...
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false
      - name: Installer unit tests
        run: go test -v ./...
      - name: Static checks
        run: go vet ./...
      - name: Source install, cached reinstall, and host smoke test
        env:
          GOHMOS_TEST_REPOSITORY: https://github.com/ZxillyFork/go-hmos.git
        run: go test -v -run '^TestRealInstallation$' -timeout 25m
